        <section class="contact">
            <h2>Contactez-<span>moi</span></h2>

            <p class="contact-intro">
                Vous souhaitez me contacter ? Remplissez le formulaire ci-dessous.
            </p>

            <div class="contact-container">

                <div class="contact-info">
                    <h3>Mes coordonnées</h3>

                    <p><strong>Nom :</strong> Robert Gbema</p>

                    <p>
                        <strong>Téléphone :</strong>
                        <a href="tel:0979924301">0979924301</a>
                    </p>

                    <p>
                        <strong>Instagram :</strong>
                        <a href="https://www.instagram.com/" target="_blank">
                            Robert Gbema
                        </a>
                    </p>
                </div>

                <form id="contactForm">

                    <input type="text" id="nom"
                        placeholder="Votre nom" required>

                    <input type="email" id="email"
                        placeholder="Votre adresse e-mail" required>

                    <input type="text" id="sujet"
                        placeholder="Sujet du message" required>

                    <textarea id="message"
                        placeholder="Votre message" required></textarea>

                    <button type="submit" class="btn">
                        Envoyer le message
                    </button>

                    <p id="formMessage"></p>

                </form>

            </div>
        </section>
